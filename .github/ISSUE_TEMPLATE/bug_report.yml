name: Bug report
description: Something did not do what the documentation says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: `python tools/acceptance.py` runs ten waves of checks and prints the reason
        for every failure. If it fails, that output is the most useful thing you can paste here.

        If this is a security issue, please **do not** open a public issue — see
        [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command and the exact output. Paste text rather than a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: If a document told you to expect it, link to the line.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `amnesia --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12.1 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance output, if it fails
      description: Optional, but it usually finds the cause immediately.
      render: text
    validations:
      required: false
